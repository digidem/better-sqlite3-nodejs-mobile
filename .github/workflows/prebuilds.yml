name: Generate prebuilds

# This workflow is a custom variant of
# digidem/nodejs-mobile-bare-prebuilds' reusable `prebuild` action. The
# reusable action can't be used directly because better-sqlite3 ships no
# CMakeLists.txt — we inject a custom one from this repo — and the
# built .node file has to be renamed from kebab-case to snake_case for
# better-sqlite3's bindings loader. The release step does use the
# reusable release.yml workflow as-is.

env:
  MODULE_NAME: "better-sqlite3"
  # The nodejs-mobile release to build against, named as it is tagged but
  # without the leading `v`. Passed to the build via `-D NAPI_NODE_VERSION`.
  # better-sqlite3 >= 13 is an N-API addon, so one binary per target serves
  # every runtime and the Node ABI never appears in an asset name.
  NODE_VERSION: "24.19.0-0"

on:
  workflow_dispatch:
    inputs:
      module_version:
        description: "Module version"
        required: true
        default: "13"
        type: string
      publish_release:
        description: "Publish release"
        required: false
        default: true
        type: boolean

jobs:
  resolve:
    runs-on: ubuntu-slim
    outputs:
      # Exact module version resolved from the dispatch input.
      module_version: ${{ steps.resolve.outputs.module_version }}
      # NODE_VERSION, re-exported so the reusable test workflows can be pinned
      # to it — `env` isn't in scope in a `with:` block.
      node_version: ${{ steps.resolve.outputs.node_version }}
    steps:
      - name: Resolve module version
        id: resolve
        run: |
          set -euo pipefail

          # `--json` because a range input (e.g. "13") makes npm print one line
          # per matching version; take the highest. An exact version yields a
          # bare string, which is why a range is the case that breaks.
          module_version=$(npm view "${MODULE_NAME}@${{ inputs.module_version }}" version --json \
            | jq -r 'if type == "array" then .[-1] else . end')
          addon_api=$(npm view "${MODULE_NAME}@${module_version}" dependencies --json \
            | jq -r '."node-addon-api" // empty')
          # Detect N-API from the dependency rather than a version check, so
          # this keeps working if a sibling module adopts N-API later.
          if [ -z "$addon_api" ]; then
            echo "::error::${MODULE_NAME}@${module_version} does not depend on node-addon-api. better-sqlite3 < 13 uses raw V8 bindings and needs the nodejs-mobile v18 line, which this workflow no longer builds — check out the legacy-nodejs-mobile-v18 tag to rebuild it, or use the already-published 11.x / 12.x releases."
            exit 1
          fi
          echo "module_version=${module_version}" >> "$GITHUB_OUTPUT"
          echo "node_version=${NODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${MODULE_NAME}@${module_version} against nodejs-mobile v${NODE_VERSION}"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: android, arch: arm, target: android-arm, runs_on: ubuntu-22.04 }
          - { platform: android, arch: arm64, target: android-arm64, runs_on: ubuntu-22.04 }
          - { platform: android, arch: x64, target: android-x64, runs_on: ubuntu-22.04 }
          - { platform: ios, arch: arm64, target: ios-arm64, runs_on: macos-latest }
          # NodeMobile.xcframework has no x86_64 simulator slice on the 24.x
          # line, so there is no ios-x64-simulator target.
          - { platform: ios, arch: arm64, target: ios-arm64-simulator, runs_on: macos-latest, simulator: true }
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    name: better-sqlite3 (${{ matrix.target }})

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download npm package and unpack
        run: npm pack ${{ env.MODULE_NAME }}@${{ needs.resolve.outputs.module_version
          }} | xargs tar -zxvf

      - name: Copy custom CMakeLists.txt
        run: cp ./CMakeLists.txt ./package/

      - run: npm install -g bare-make

      - name: Install deps for package
        working-directory: ./package
        run: npm install --ignore-scripts

      - name: Install cmake build tools
        working-directory: ./package
        run: npm install -D --ignore-scripts cmake-bare cmake-fetch

      - name: Install patched cmake-napi
        working-directory: ./package
        run: npm install -D --ignore-scripts
          cmake-napi@github:digidem/cmake-napi-nodejs-mobile

      - name: Generate
        working-directory: ./package
        run: |
          # Select which nodejs-mobile runtime cmake-napi links against. Requires
          # the NAPI_NODE_VERSION override added in digidem/cmake-napi-nodejs-mobile.
          extra_args=(-D NAPI_NODE_VERSION=${{ env.NODE_VERSION }})
          if [ "${{ matrix.platform }}" = "android" ]; then
            extra_args+=(-D CMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384")
            # RELR packed relocations (emitted by default when targeting
            # API >= 28 on recent NDKs; the bare-make toolchain defaults to
            # android-29) SIGSEGV on Android < 9 — the older linker skips
            # the unknown DT_ANDROID_RELR entries. Pin to nodejs-mobile's
            # support floor instead. Mirrors
            # digidem/nodejs-mobile-bare-prebuilds#9.
            extra_args+=(-D ANDROID_PLATFORM=android-24)
          fi
          if [ "${{ matrix.platform }}" = "ios" ]; then
            # Build with Apple clang, not Homebrew LLVM: the latter's libc++
            # headers carry no availability annotations, so the addon links
            # symbols newer than the deployment target (e.g. std::__hash_memory
            # from LLVM 21) and SIGSEGVs on older iOS.
            extra_args+=(-D APPLE_CLANG=ON)
          fi
          if [ "${{ matrix.simulator }}" = "true" ]; then
            extra_args+=(--simulator)
          fi
          bare-make generate \
            --platform ${{ matrix.platform }} \
            --arch ${{ matrix.arch }} \
            "${extra_args[@]}"

      - name: Build
        working-directory: ./package
        run: bare-make build

      - name: Install
        working-directory: ./package
        run: bare-make install

      - name: Rename
        working-directory: ./package
        # bare-make uses kebab-case for filenames, but better-sqlite3 expects snake_case for the .node file
        run: |
          mv ./prebuilds/${{ matrix.target }}/better-sqlite3.node \
          ./prebuilds/${{ matrix.target }}/better_sqlite3.node

      - name: Upload prebuild artifacts
        uses: actions/upload-artifact@v7
        with:
          name: better-sqlite3-${{ needs.resolve.outputs.module_version }}-${{
            matrix.target }}
          path: ./package/prebuilds/${{ matrix.target }}/*.node

  test-android:
    needs: [ resolve, build ]
    uses: digidem/nodejs-mobile-bare-prebuilds/.github/workflows/test-android.yml@v3
    with:
      module_spec: better-sqlite3@${{ needs.resolve.outputs.module_version }}
      # The default 'smoke' runner (just `require(module)`) doesn't exercise
      # better-sqlite3's native binding — it's loaded lazily inside the
      # Database constructor. See test/smoke.js for details.
      test_runner: custom
      test_script: test/smoke.js
      nodejs_mobile_version: v${{ needs.resolve.outputs.node_version }}

  test-ios:
    needs: [ resolve, build ]
    uses: digidem/nodejs-mobile-bare-prebuilds/.github/workflows/test-ios.yml@v3
    with:
      module_spec: better-sqlite3@${{ needs.resolve.outputs.module_version }}
      test_runner: custom
      test_script: test/smoke.js
      nodejs_mobile_version: v${{ needs.resolve.outputs.node_version }}

  release:
    if: ${{ inputs.publish_release }}
    needs: [ resolve, test-android, test-ios ]
    permissions:
      contents: write
    uses: digidem/nodejs-mobile-bare-prebuilds/.github/workflows/release.yml@v3
    with:
      module_spec: better-sqlite3@${{ needs.resolve.outputs.module_version }}
